name: Проверки

# Гейт на каждый PR и на main: типы, юнит-тесты ядра и дымовой тест сцен.
# Последний ловит то, чего не видят юнит-тесты, — падение внутри сцены Phaser,
# от которого игра замирает и перестаёт отвечать на нажатия.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # На раннерах GitHub уже стоит Chrome — playwright-core берёт его и ничего не качает.
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run bridge:build

      - name: Типы
        run: npm run typecheck

      - name: Юнит-тесты
        run: npm test --workspaces --if-present

      - name: Словари RU/UZ
        run: npm run check:content

      - name: Дымовой тест сцен
        run: npm run check:smoke

  backend:
    # Score Engine начисляет настоящие баллы: его правила проверяются отдельно
    # от игр, и падение здесь не должно ждать семнадцать минут дымового теста.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt pytest httpx

      - name: Тесты Score Engine
        run: python -m pytest -q
