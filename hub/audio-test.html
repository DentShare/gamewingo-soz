<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameWingo — проверка звука</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🔈%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; --ink:#1A1A1A; --muted:#8E97A7; --line:#e4e7ee;
          --orange:#F76624; --bg:#F9F9F9; --bad:#c62828; --good:#2e7d32; }
  * { box-sizing: border-box; }
  body { margin:0; padding:18px 16px 40px; background:var(--bg); color:var(--ink);
         font:15px/1.5 -apple-system, "SF Pro Text", system-ui, Roboto, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row b { font-variant-numeric: tabular-nums; }
  .ok { color:var(--good); } .err { color:var(--bad); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; }
  button { font:inherit; padding:12px 8px; border-radius:12px; border:1px solid var(--line);
           background:#fff; cursor:pointer; }
  button.primary { background:var(--orange); border-color:var(--orange); color:#fff; font-weight:600; }
  .hint { color:var(--muted); font-size:13px; }
  .hint b { color:var(--ink); }
</style>
</head>
<body>

<h1>Проверка звука</h1>
<p class="sub">Страница для диагностики: показывает, что именно не работает, если игры молчат.</p>

<div class="panel">
  <button id="start" class="primary" style="width:100%">Включить звук и загрузить пак</button>
</div>

<div class="panel" id="state"></div>

<div class="panel">
  <div class="grid" id="sounds"></div>
</div>

<div class="panel hint" id="advice"></div>

<script type="module">
  // Страница намеренно не тянет Phaser: проверяем ровно тот же WebAudio-слой,
  // что в играх, но без игрового движка — чтобы отделить звук от всего прочего.
  const NAMES = ['tap', 'ok', 'wrong', 'win', 'lose', 'coin', 'star', 'swipe'];
  const MUTE_KEY = 'wingo:sound';
  let ctx = null, master = null;
  const buffers = new Map();
  const log = [];

  const Ctor = window.AudioContext || window.webkitAudioContext || null;

  function decode(raw) {
    return new Promise((resolve, reject) => {
      const maybe = ctx.decodeAudioData(raw, resolve, reject);
      if (maybe && typeof maybe.then === 'function') maybe.then(resolve, reject);
    });
  }

  async function loadPack() {
    await Promise.all(NAMES.map(async (name) => {
      if (buffers.has(name)) return;
      try {
        const res = await fetch(`quiz/audio/${name}.mp3`);
        if (!res.ok) { log.push(`${name}.mp3 → HTTP ${res.status}`); return; }
        buffers.set(name, await decode(await res.arrayBuffer()));
      } catch (e) { log.push(`${name}.mp3 → ${e && e.message ? e.message : e}`); }
    }));
    render();
  }

  function unlock() {
    if (!Ctor) return render();
    if (!ctx) {
      ctx = new Ctor();
      master = ctx.createGain();
      master.gain.value = localStorage.getItem(MUTE_KEY) === 'off' ? 0 : 0.5;
      master.connect(ctx.destination);
    }
    if (ctx.state !== 'running') ctx.resume();
    try {
      const s = ctx.createBufferSource();
      s.buffer = ctx.createBuffer(1, 1, 22050);
      s.connect(ctx.destination); s.start(0);
    } catch (e) { log.push('беззвучный сэмпл: ' + e.message); }
    loadPack();
    render();
  }

  function play(name) {
    if (!ctx) unlock();
    if (!ctx) return;
    if (ctx.state !== 'running') { ctx.resume(); }
    const buf = buffers.get(name);
    if (buf) {
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(master); src.start();
    } else {
      // Файла нет — проверяем, слышен ли хотя бы синтез.
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'triangle'; osc.frequency.value = 660;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
      osc.connect(g); g.connect(master); osc.start(); osc.stop(ctx.currentTime + 0.22);
    }
    setTimeout(render, 120);
  }

  function render() {
    const muted = localStorage.getItem(MUTE_KEY) === 'off';
    const rows = [
      ['WebAudio в браузере', Ctor ? 'есть' : 'НЕТ', !!Ctor],
      ['Состояние контекста', ctx ? ctx.state : 'не создан', ctx && ctx.state === 'running'],
      ['Загружено звуков', `${buffers.size} из ${NAMES.length}`, buffers.size === NAMES.length],
      ['Беззвучный режим каталога', muted ? 'ВКЛЮЧЁН — звука не будет' : 'выключен', !muted],
      ['Громкость мастера', master ? String(master.gain.value) : '—', true],
    ];
    document.getElementById('state').innerHTML = rows.map(([k, v, good]) =>
      `<div class="row"><span>${k}</span><b class="${good ? 'ok' : 'err'}">${v}</b></div>`).join('')
      + (log.length ? `<div class="row"><span>Ошибки</span><b class="err">${log.slice(0, 3).join('; ')}</b></div>` : '');

    document.getElementById('sounds').innerHTML = NAMES.map((n) =>
      `<button data-s="${n}">${n}${buffers.has(n) ? '' : ' ·синтез'}</button>`).join('');
    document.querySelectorAll('#sounds button').forEach((b) => {
      b.onclick = () => play(b.dataset.s);
    });

    const advice = [];
    if (!Ctor) advice.push('Браузер не умеет WebAudio — звука не будет ни в одной игре.');
    if (muted) advice.push('В каталоге выключен звук: включите его чипом «Звук» в меню любой игры.');
    if (ctx && ctx.state !== 'running') advice.push('Контекст не запустился: нажмите кнопку вверху ещё раз.');
    if (ctx && ctx.state === 'running' && buffers.size === NAMES.length) {
      advice.push('<b>Всё исправно.</b> Если кнопки выше нажимаются, а звука нет — '
        + 'проверьте боковой переключатель «Звонок / Бесшумно» на корпусе iPhone: '
        + 'в Safari этот переключатель глушит и звук страниц.');
    }
    document.getElementById('advice').innerHTML = advice.join('<br>') || 'Нажмите кнопку вверху.';
  }

  document.getElementById('start').onclick = unlock;
  render();
</script>
</body>
</html>
