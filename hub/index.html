<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f26522" />
<title>Игры WinGo</title>
<style>
  /* Токены из макета Figma (WinGo · Games). */
  :root {
    --orange: #F76624;        /* кнопка «Начать игру», активный язык */
    --chip-bg: #FFDDBF;
    --chip-ink: #FA7700;
    --icon-bg: #FFEBE2;
    --ink: #1A1A1A;
    --muted: #8E97A7;
    --card: #FFFFFF;
    --bg: #F9F9F9;
    --divider: rgba(217, 217, 217, .4);
    /* Макет свёрстан на SF Pro — берём системный шрифт платформы. */
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
    --font-rounded: ui-rounded, 'SF Pro Rounded', var(--font);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); color: var(--ink); background: var(--bg);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  /* Растительный фон макета — мягкое приближение без растровых ассетов. */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .4;
    background:
      radial-gradient(52vw 38vw at -14% 6%, #F2D4CC 0%, rgba(242, 212, 204, 0) 70%),
      radial-gradient(52vw 38vw at 114% 92%, #F2D4CC 0%, rgba(242, 212, 204, 0) 70%);
  }

  /* ── Шапка ─────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(270deg, #FF7700 0%, #FD7B03 49.52%, #FF5001 100%);
    padding: max(env(safe-area-inset-top, 0px), 12px) 20px 0;
  }
  .navrow { position: relative; display: flex; align-items: center; height: 46px; }
  .navrow h1 {
    position: absolute; left: 40px; right: 40px; margin: 0; text-align: center;
    font-size: 20px; line-height: 25px; letter-spacing: -.45px; font-weight: 590; color: #fff;
  }
  .back {
    width: 32px; height: 32px; display: grid; place-items: center;
    background: none; border: 0; padding: 0; color: #fff; cursor: pointer;
  }
  .back:active { opacity: .6; }

  /* ── Счётчик бонусов в шапке ───────────────────────────────────────── */
  .bonus {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px;
    border-radius: 13px; background: rgba(255, 255, 255, .22);
    color: #fff; font-size: 14px; font-weight: 590;
  }
  .bonus .coin, .fly-bonus .coin {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #FFF3CF 0%, #F3C64B 45%, #D99A12 100%);
  }
  .bonus.pulse { animation: bonus-pulse .28s ease-out; }
  @keyframes bonus-pulse {
    50% { transform: translateY(-50%) scale(1.18); }
  }

  /* Летящий «+N»: рождается в центре, transition уводит его в чип. */
  .fly-bonus {
    position: fixed; z-index: 40; display: flex; align-items: center; gap: 6px;
    color: #D99A12; font-weight: 700; font-size: 22px; pointer-events: none;
    transform: translate(-50%, -50%) scale(.2); opacity: 0;
    transition: transform .55s cubic-bezier(.55, 0, .85, .36), left .55s cubic-bezier(.55, 0, .85, .36),
                top .55s cubic-bezier(.55, 0, .85, .36), opacity .2s linear;
  }
  .fly-bonus .coin { width: 20px; height: 20px; }

  .wrap {
    max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
    padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  #sections { display: flex; flex-direction: column; gap: 20px; }

  /* ── Переключатель языка ───────────────────────────────────────────── */
  /* Полоса с маскотом: объясняет механику серии и держит бренд на главной. */
  .greet {
    display: flex; align-items: center; gap: 12px; margin: 14px 0 2px;
    background: var(--card); border: 1px solid var(--divider); border-radius: 14px;
    padding: 8px 14px 8px 10px;
  }
  .greet p { margin: 0; font-size: 14px; line-height: 1.35; color: var(--muted); }
  .greet .phoenix { flex: none; }
  .greet .phoenix .wing { transform-origin: 30px 30px; }
  .greet.flap .phoenix .wing { animation: flap .46s ease-out 2; }
  @keyframes flap { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(-26deg) } }
  @media (prefers-reduced-motion: reduce) { .greet.flap .phoenix .wing { animation: none } }

  .langs { display: flex; gap: 8px; }
  .lang {
    flex: 1; height: 40px; display: grid; place-items: center; border-radius: 12px;
    background: var(--card); color: var(--ink);
    font-size: 12px; line-height: 16px; font-weight: 590; cursor: pointer;
  }
  .lang.active { background: var(--orange); color: #fff; }

  /* ── Секции ────────────────────────────────────────────────────────── */
  section { display: flex; flex-direction: column; gap: 8px; }
  .section-title {
    margin: 0; font-size: 17px; line-height: 22px; letter-spacing: -.43px; font-weight: 590;
  }
  .card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--card); border-radius: 12px; padding: 12px;
  }

  /* ── Карточка игры ─────────────────────────────────────────────────── */
  .item { display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
  .item + .item { padding-top: 12px; border-top: 1px solid var(--divider); }
  .row { display: flex; gap: 12px; align-items: center; }
  .thumb {
    width: 82px; height: 82px; flex: none; border-radius: 12px;
    background: var(--icon-bg); display: grid; place-items: center;
  }
  .thumb text { font-family: var(--font-rounded); }
  .thumb-img { width: 82px; height: 82px; display: block; border-radius: 12px; }
  .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .meta h3 { margin: 0; font-size: 15px; line-height: 20px; letter-spacing: -.23px; font-weight: 590; }
  .meta .desc { margin: 0; font-size: 12px; line-height: 16px; color: var(--muted); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    font-family: var(--font-rounded); font-weight: 700; font-size: 12px; line-height: 22px;
    padding: 4px 8px; border-radius: 8px; background: var(--chip-bg); color: var(--chip-ink);
  }

  .cta {
    width: 100%; height: 40px; border: 0; border-radius: 12px; background: var(--orange);
    color: #fff; font-family: inherit; font-size: 15px; line-height: 20px;
    letter-spacing: -.23px; font-weight: 590; cursor: pointer;
  }
  .cta:active { opacity: .85; }

  /* ── «Скоро» ───────────────────────────────────────────────────────── */
  .item.soon { opacity: .55; cursor: default; }
  .chip.soon { background: #ECEEF1; color: var(--muted); }
</style>
</head>
<body>

      id: '2048',
      title: { ru: '2048', uz: '2048' },
      desc: { ru: 'Сливай плитки и дойди до 2048', uz: 'Plitkalarni qoʻshib 2048 ga yet' },
      url: '2048/',
      tags: ['RU', 'UZ', { ru: 'Логика', uz: 'Mantiq', accent: true }],
    },
    {
      id: 'sudoku-kids',
      title: { ru: 'Мини-судоку', uz: 'Mini sudoku' },
      desc: { ru: 'Судоку 4×4 и 6×6 для детей', uz: 'Bolalar uchun 4×4 va 6×6 sudoku' },
      url: 'sudoku-kids/',
      tags: ['RU', 'UZ', { ru: 'Детям', uz: 'Bolalarga', accent: true }],
    },
    {
      id: 'quiz',
      title: { ru: 'Викторина', uz: 'Viktorina' },
      desc: {
        ru: 'Вопросы и интересные факты: космос, животные, деньги',
        uz: 'Savollar va qiziqarli faktlar: kosmos, hayvonlar, pul',
      },
      url: 'quiz/',
      tags: ['RU', 'UZ', { ru: 'Факты', uz: 'Faktlar', accent: true }],
    },
    {
      id: 'sums',
      title: { ru: 'Суммы', uz: 'Yigʻindilar' },
      desc: {
        ru: 'Вычеркни лишние числа, чтобы сошлись суммы',
        uz: 'Yigʻindilar toʻgʻri kelishi uchun ortiqcha sonlarni oʻchir',
      },
      url: 'sums/',
      tags: ['RU', 'UZ', { ru: 'Логика', uz: 'Mantiq', accent: true }],
    },
  ];
  const SOON = [];

  const SECTIONS = [
    { key: 'kids', games: KIDS },
    { key: 'arcade', games: ARCADE },
    { key: 'puzzles', games: PUZZLES },
    { key: 'soon', games: SOON, soon: true },
  ];

  const STR = {
    ru: {
      title: 'Игры', back: 'Назад', play: 'Начать игру',
      kids: 'Малышам • без проигрыша', arcade: 'Аркады • играй сразу',
      puzzles: 'Головоломки', soon: 'Скоро', soonBadge: 'Скоро',
      greet: 'Заходите каждый день — серия бонусов растёт',
    },
    uz: {
      title: 'Oʻyinlar', back: 'Orqaga', play: 'Oʻynashni boshlash',
      kids: 'Kichkintoylarga • yutqazish yoʻq', arcade: 'Arkada • darrov oʻyna',
      puzzles: 'Boshqotirmalar', soon: 'Tez orada', soonBadge: 'Tez orada',
      greet: 'Har kuni kiring — bonus seriyasi oʻsadi',
    },
  };

  let lang = localStorage.getItem('wingoHubLang') || 'ru';

  /**
   * Событие приложению — тот же транспорт, что и в @gamewingo/game-bridge
   * (iOS WKWebView → Android WebView → postMessage родителю).
   */
  function postToApp(event) {
    const w = window;
    if (w.webkit && w.webkit.messageHandlers && w.webkit.messageHandlers.gameBridge) {
      w.webkit.messageHandlers.gameBridge.postMessage(event);
      return true;
    }
    if (w.AndroidBridge) { w.AndroidBridge.onGameEvent(JSON.stringify(event)); return true; }
    if (w.parent !== w) { w.parent.postMessage(event, '*'); return true; }
    return false;
  }

  function chipsHtml(tags) {
    return tags.map((t) => (typeof t === 'string'
      ? `<span class="chip">${t}</span>`
      : `<span class="chip${t.accent ? ' accent' : ''}">${t[lang]}</span>`)).join('');
  }

  /** Иконка игры: файл из макета, если он есть, иначе векторный запасной вариант. */
  function iconHtml(id) {
    return FILE_ICONS.has(id)
      ? `<img class="thumb-img" src="icons/${id}.svg" width="82" height="82" alt="" loading="lazy" />`
      : (ICONS[id] || '');
  }

  function itemHtml(g, s, soon) {
    const chips = soon ? `<span class="chip soon">${s.soonBadge}</span>` : chipsHtml(g.tags);
    const cta = soon ? '' : `<button class="cta" type="button">${s.play}</button>`;
    return `
      <article class="item${soon ? ' soon' : ''}"${soon ? '' : ` data-url="${g.url}"`}>
        <div class="row">
          <div class="thumb">${iconHtml(g.id)}</div>
          <div class="meta">
            <h3>${g.title[lang]}</h3>
            <p class="desc">${g.desc[lang]}</p>
            <div class="chips">${chips}</div>
          </div>
        </div>
        ${cta}
      </article>`;
  }

  function render() {
    const s = STR[lang];
    document.documentElement.lang = lang;
    document.getElementById('hTitle').textContent = s.title;
    document.getElementById('greetText').textContent = s.greet;
    document.getElementById('back').setAttribute('aria-label', s.back);
    document.querySelectorAll('.lang').forEach((el) =>
      el.classList.toggle('active', el.dataset.lang === lang));

    // Пустые секции (например «Скоро») не рисуются вовсе.
    document.getElementById('sections').innerHTML = SECTIONS
      .filter((sec) => sec.games.length > 0)
      .map((sec) => `
        <section>
          <h2 class="section-title">${s[sec.key]}</h2>
          <div class="card">${sec.games.map((g) => itemHtml(g, s, sec.soon)).join('')}</div>
        </section>`)
      .join('');
  }

  document.getElementById('sections').addEventListener('click', (e) => {
    const item = e.target.closest('.item[data-url]');
    // Язык уезжает в игру параметром: ключ wingoHubLang игра тоже читает, но по
    // ссылке с ?lang= игру можно переслать, и она откроется на нужном языке.
    if (item) window.location.href = `${item.dataset.url}?lang=${lang}`;
  });

  // Назад: просим приложение закрыть раздел игр; вне WebView — обычная история браузера.
  document.getElementById('back').addEventListener('click', () => {
    if (!postToApp({ type: 'GAME_EXIT', sessionId: '' }) && history.length > 1) history.back();
  });

  document.querySelectorAll('.lang').forEach((el) =>
    el.addEventListener('click', () => {
      lang = el.dataset.lang;
      try { localStorage.setItem('wingoHubLang', lang); } catch (err) { /* приватный режим */ }
      render();
    }));

  render();

  // ── Бонусы: чек-ин за вход и счётчик в шапке ───────────────────────────────
  // Кошелёк зеркалит @gamewingo/game-progress (ключ и форма данных совпадают):
  // хаб — статический HTML и не может импортировать TS-пакет. Демо-режим:
  // в проде баланс придёт от сервера, начисление здесь исчезнет, анимация останется.
  const BONUS_KEY = 'wingo:bonus';
  const CHECKIN_BASE = 5, CHECKIN_CAP = 25;
  const dayIdNow = () => Math.floor((Date.now() + 5 * 3600e3) / 86400e3);

  function readWallet() {
    try {
      const raw = JSON.parse(localStorage.getItem(BONUS_KEY) || '{}');
      return {
        balance: Number(raw.balance) || 0,
        keys: Array.isArray(raw.keys) ? raw.keys : [],
        checkin: { last: Number(raw.checkin && raw.checkin.last) || 0, run: Number(raw.checkin && raw.checkin.run) || 0 },
      };
    } catch (err) { return { balance: 0, keys: [], checkin: { last: 0, run: 0 } }; }
  }
  function saveWallet(w) {
    try { localStorage.setItem(BONUS_KEY, JSON.stringify(w)); } catch (err) { /* приватный режим */ }
  }

  /** Чек-ин с серией: вчера заходил — серия растёт, пропустил день — заново. */
  function claimCheckin() {
    const w = readWallet();
    const day = dayIdNow();
    if (w.checkin.last === day) return null;
    const run = w.checkin.last === day - 1 ? w.checkin.run + 1 : 1;
    const amount = Math.min(CHECKIN_BASE * run, CHECKIN_CAP);
    w.checkin = { last: day, run };
    w.balance += amount;
    saveWallet(w);
    return { amount: amount, run: run };
  }

  const bonusVal = document.getElementById('bonusVal');
  const bonusChip = document.getElementById('bonusChip');

  /** Число докручивается до нового значения — баланс растёт на глазах. */
  function countBalanceUp(from, to) {
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 450);
      bonusVal.textContent = String(Math.round(from + (to - from) * k));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /** «+N» появляется в центре экрана и улетает в счётчик шапки. */
  function flyBonus(amount, from, to) {
    const el = document.createElement('div');
    el.className = 'fly-bonus';
    el.innerHTML = '<span class="coin"></span>+' + amount;
    el.style.left = '50%';
    el.style.top = '190px';
    document.body.appendChild(el);
    // Кадр 1: появление с отскоком; затем полёт к чипу.
    requestAnimationFrame(() => {
      el.style.opacity = '1';
      el.style.transform = 'translate(-50%, -50%) scale(1)';
      setTimeout(() => {
        const r = bonusChip.getBoundingClientRect();
        el.style.left = (r.left + r.width / 2) + 'px';
        el.style.top = (r.top + r.height / 2) + 'px';
        el.style.transform = 'translate(-50%, -50%) scale(.35)';
        setTimeout(() => {
          el.remove();
          bonusChip.classList.add('pulse');
          setTimeout(() => bonusChip.classList.remove('pulse'), 300);
          countBalanceUp(from, to);
        }, 560);
      }, 820);
    });
  }

  const balanceBefore = readWallet().balance;
  bonusVal.textContent = String(balanceBefore);
  const checkin = claimCheckin();
  if (checkin) {
    setTimeout(() => flyBonus(checkin.amount, balanceBefore, balanceBefore + checkin.amount), 700);
    // Феникс машет крылом ровно в тот момент, когда прилетает бонус за вход.
    const greet = document.getElementById('greet');
    setTimeout(() => greet.classList.add('flap'), 700);
    setTimeout(() => greet.classList.remove('flap'), 2400);
  }
</script>
</body>
</html>
