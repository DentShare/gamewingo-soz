<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f26522" />
<title>Игры WinGo</title>
<style>
  @font-face {
    font-family: 'Rubik'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/rubik-latin-400.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2122, U+2212;
  }
  @font-face {
    font-family: 'Rubik'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/rubik-cyrillic-400.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Rubik'; font-style: normal; font-weight: 500; font-display: swap;
    src: url('fonts/rubik-latin-500.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2122, U+2212;
  }
  @font-face {
    font-family: 'Rubik'; font-style: normal; font-weight: 500; font-display: swap;
    src: url('fonts/rubik-cyrillic-500.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Rubik'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('fonts/rubik-latin-600.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2122, U+2212;
  }
  @font-face {
    font-family: 'Rubik'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('fonts/rubik-cyrillic-600.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }

  :root {
    --orange: #f26522; --orange-lt: #f7752f; --orange-dk: #ef5a1c; --orange-ink: #d1590f;
    --ink: #241a12; --muted: #9a908a;
    --card: #ffffff; --bg: #fffdfc; --line: #f4e9e2;
    --chip: #fdeadd; --chip-accent: #fbd9bf;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: 'Rubik', system-ui, sans-serif; color: var(--ink);
    background: var(--bg); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  /* Мягкие декоративные пятна фона — вместо растрового паттерна из макета. */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(36vw 36vw at -10% 30%, #fdf1ea 0%, rgba(253,241,234,0) 72%),
      radial-gradient(40vw 40vw at 110% 66%, #fdf3ec 0%, rgba(253,243,236,0) 72%);
  }

  /* ── Шапка ─────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(115deg, #f9891f 0%, #f26522 55%, #ee4f21 100%);
    color: #fff; display: flex; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 6px 10px;
  }
  .topbar h1 { flex: 1; margin: 0; text-align: center; font-size: 18px; font-weight: 500; }
  .icon-btn {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center;
    background: none; border: 0; padding: 0; color: #fff; cursor: pointer;
  }
  .icon-btn:active { opacity: .6; }

  .wrap { max-width: 440px; margin: 0 auto; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }

  /* ── Переключатель языка ───────────────────────────────────────────── */
  .langs { display: flex; gap: 12px; padding: 18px 16px 2px; }
  .lang {
    flex: 1; height: 44px; display: grid; place-items: center; border-radius: 14px;
    font-size: 15px; font-weight: 500; color: var(--ink); cursor: pointer;
    background: var(--card); border: 1px solid #f1e5dd; box-shadow: 0 2px 8px rgba(36, 26, 18, .05);
    transition: transform .08s ease;
  }
  .lang:active { transform: scale(.985); }
  .lang.active {
    background: linear-gradient(180deg, var(--orange-lt), var(--orange-dk));
    color: #fff; border-color: transparent; box-shadow: 0 5px 14px rgba(242, 101, 34, .3);
  }

  /* ── Секции ────────────────────────────────────────────────────────── */
  .section-title { margin: 26px 20px 12px; font-size: 19px; font-weight: 600; }
  .card {
    margin: 0 16px; padding: 14px; background: var(--card); border-radius: 20px;
    border: 1px solid #f5eae3; box-shadow: 0 8px 22px rgba(36, 26, 18, .06);
  }

  /* ── Карточка игры ─────────────────────────────────────────────────── */
  .item { cursor: pointer; }
  .item + .item { margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--line); }
  .row { display: flex; gap: 14px; align-items: flex-start; }
  .thumb {
    width: 76px; height: 76px; flex: none; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(160deg, #fdeee4, #fbe2d3);
  }
  .meta { flex: 1; min-width: 0; padding-top: 2px; }
  .meta h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; }
  .meta .desc { margin: 5px 0 0; font-size: 13.5px; line-height: 1.35; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .chip {
    font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 8px;
    background: var(--chip); color: var(--orange-ink);
  }
  .chip.accent { background: var(--chip-accent); color: #b4480b; }

  .cta {
    display: block; width: 100%; height: 46px; margin-top: 12px; border: 0; border-radius: 12px;
    background: linear-gradient(180deg, var(--orange-lt), var(--orange-dk));
    color: #fff; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer;
    box-shadow: 0 5px 14px rgba(242, 101, 34, .28);
  }
  .cta:active { transform: translateY(1px); box-shadow: 0 2px 7px rgba(242, 101, 34, .24); }

  /* ── «Скоро» ───────────────────────────────────────────────────────── */
  .item.soon { opacity: .65; cursor: default; }
  .chip.soon { background: #efe6df; color: #8a7c72; }

  footer { margin: 24px 20px 0; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back" aria-label="Назад">
      <svg width="11" height="19" viewBox="0 0 11 19" fill="none" aria-hidden="true">
        <path d="M9.5 1.5L2 9.5l7.5 8" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 id="hTitle">Игры</h1>
    <span class="icon-btn" aria-hidden="true"></span>
  </header>

  <main class="wrap">
    <div class="langs">
      <div class="lang active" data-lang="ru">Русский</div>
      <div class="lang" data-lang="uz">Oʻzbekcha</div>
    </div>

    <div id="sections"></div>

    <footer id="foot"></footer>
  </main>

<script>
  // Иконки игр — инлайн-SVG (ноль запросов, чёткие на любом DPR).
  const ICONS = {

    flyer: `<svg viewBox="0 0 48 48" width="54" height="54" aria-hidden="true">
      <rect x="2" y="0" width="12" height="19" rx="3" fill="#f5841f"/>
      <rect x="2" y="31" width="12" height="17" rx="3" fill="#f5841f"/>
      <rect x="34" y="0" width="12" height="14" rx="3" fill="#f9a664"/>

      <circle cx="24" cy="24" r="17" fill="#f26522"/>
      <circle cx="24" cy="24" r="11.5" fill="#fff"/>
      <circle cx="24" cy="24" r="6.5" fill="#f26522"/>
      <circle cx="24" cy="24" r="2.6" fill="#fff"/></svg>`,
    snake: `<svg viewBox="0 0 48 48" width="54" height="54" aria-hidden="true">
      <rect x="4" y="26" width="13" height="13" rx="4" fill="#2fb84c"/>
      <rect x="16" y="26" width="13" height="13" rx="4" fill="#3ac95a"/>
      <rect x="16" y="15" width="13" height="13" rx="4" fill="#3ac95a"/>

      <circle cx="37" cy="20" r="1.7" fill="#fff"/>
      <circle cx="12" cy="11" r="5.5" fill="#f26522"/></svg>`,
    soz: `<svg viewBox="0 0 48 48" width="54" height="54" aria-hidden="true">
      <rect x="3" y="4" width="13.5" height="13" rx="3.6" fill="#c9bdb3"/>
      <rect x="17.5" y="4" width="13.5" height="13" rx="3.6" fill="#eb9d2e"/>

      <rect x="17.5" y="18" width="13.5" height="13" rx="3.6" fill="#c9bdb3"/>
      <rect x="32" y="18" width="13.5" height="13" rx="3.6" fill="#eb9d2e"/>

      </g>
      <g transform="rotate(8 33 24)">
        <rect x="24" y="10" width="19" height="28" rx="5" fill="#fff" stroke="#f2ded0" stroke-width="1.5"/>

    fifteen: `<svg viewBox="0 0 48 48" width="54" height="54" aria-hidden="true">
      <rect x="4" y="4" width="40" height="40" rx="9" fill="#fff" stroke="#f2ded0" stroke-width="1.5"/>

        <text x="24" y="28" fill="#fff">4</text>
        <text x="37" y="28" fill="#fff">8</text>
      </g></svg>`,
    'sudoku-kids': `<svg viewBox="0 0 48 48" width="54" height="54" aria-hidden="true">
      <rect x="4" y="4" width="40" height="40" rx="9" fill="#fff" stroke="#f2ded0" stroke-width="1.5"/>
      <path d="M14.5 5v38M33.5 5v38M5 14.5h38M5 33.5h38" stroke="#f8ece4" stroke-width="1"/>
      <path d="M24 5v38M5 24h38" stroke="#f0dccd" stroke-width="1.8"/>
      <g font-family="Rubik, sans-serif" font-size="10" font-weight="600" text-anchor="middle">
        <text x="9.7" y="18" fill="#f26522">1</text>
        <text x="19.2" y="37" fill="#2fb84c">2</text>
        <text x="38.7" y="18" fill="#eb9d2e">3</text>
      </g></svg>`,
  };

  // Каталог игр. URL относительные — хаб и игры живут в одном Vercel-проекте
  // (см. scripts/build-catalog.mjs); абсолютные URL для приложения — в manifest.json.

  // Малышам: нет таймера и проигрыша, ошибка — мягкая подсказка.
  const KIDS = [
    {
      id: 'sorting',
      title: { ru: 'Сортировка', uz: 'Saralash' },
      desc: { ru: 'Разложи фигурки по цвету и форме', uz: 'Shakllarni rang va shaklga ajrat' },
      url: 'sorting/',
      tags: ['RU', 'UZ', { ru: '3–6 лет', uz: '3–6 yosh', accent: true }],
    },
    {
      id: 'counting',
      title: { ru: 'Счёт', uz: 'Sanoq' },
      desc: { ru: 'Посчитай предметы и найди цифру', uz: 'Buyumlarni sanab, raqamni top' },
      url: 'counting/',
      tags: ['RU', 'UZ', { ru: '4–7 лет', uz: '4–7 yosh', accent: true }],
    },
  ];
  // Аркады: заходишь и играешь — партия на 30–60 секунд, управление одним пальцем.
  const ARCADE = [
    {
      id: 'stack',
      title: { ru: 'Башня', uz: 'Minora' },
      desc: { ru: 'Тап — блок падает. Строй башню выше', uz: 'Bosing — blok tushadi. Minorani balandroq quring' },
      url: 'stack/',
      tags: ['RU', 'UZ', { ru: 'Один тап', uz: 'Bir bosish', accent: true }],
    },
    {
      id: 'flyer',
      title: { ru: 'Полёт', uz: 'Parvoz' },
      desc: { ru: 'Тапай и пролетай сквозь проёмы', uz: 'Bosing va teshiklardan uching' },
      url: 'flyer/',
      tags: ['RU', 'UZ', { ru: 'Один тап', uz: 'Bir bosish', accent: true }],
    },
    {
      id: 'targets',
      title: { ru: 'Меткий глаз', uz: 'Nishonga ur' },
      desc: { ru: 'Бей по целям 60 секунд — держи серию', uz: '60 soniya nishonga ur — ketma-ketlikni ushla' },
      url: 'targets/',
      tags: ['RU', 'UZ', { ru: 'Реакция', uz: 'Reaksiya', accent: true }],
    },
    {
      id: 'snake',
      title: { ru: 'Змейка', uz: 'Ilon' },
      desc: { ru: 'Свайпай, ешь и расти', uz: 'Suring, yeng va oʻsing' },
      url: 'snake/',
      tags: ['RU', 'UZ', { ru: 'Классика', uz: 'Klassika', accent: true }],
    },
  ];
  const PUZZLES = [
    {
      id: 'soz',
      title: { ru: '5 букв', uz: '5 harf' },
      desc: { ru: 'Угадай слово из 5 букв за 6 попыток', uz: '5 harfli soʻzni 6 urinishda top' },
      url: 'soz/',
      tags: ['RU', 'UZ', { ru: 'Слова', uz: 'Soʻzlar', accent: true }],
    },
    {
      id: 'pairs',
      title: { ru: 'Найди пару', uz: 'Juftini top' },
      desc: { ru: 'Открывай карточки и находи пары', uz: 'Kartochkalarni ochib juftlarni top' },
      url: 'pairs/',
      tags: ['RU', 'UZ', { ru: 'Детям', uz: 'Bolalarga', accent: true }],
    },
    {
      id: 'fifteen',
      title: { ru: 'Пятнашки', uz: 'Boshqotirma 15' },
      desc: { ru: 'Собери числа по порядку', uz: 'Raqamlarni tartib bilan yigʻ' },
      url: 'fifteen/',
      tags: ['RU', 'UZ', { ru: 'Логика', uz: 'Mantiq', accent: true }],
    },
    {
      id: '2048',
      title: { ru: '2048', uz: '2048' },
      desc: { ru: 'Сливай плитки и дойди до 2048', uz: 'Plitkalarni qoʻshib 2048 ga yet' },
      url: '2048/',
      tags: ['RU', 'UZ', { ru: 'Логика', uz: 'Mantiq', accent: true }],
    },
    {
      id: 'sudoku-kids',
      title: { ru: 'Мини-судоку', uz: 'Mini sudoku' },
      desc: { ru: 'Судоку 4×4 и 6×6 для детей', uz: 'Bolalar uchun 4×4 va 6×6 sudoku' },
      url: 'sudoku-kids/',
      tags: ['RU', 'UZ', { ru: 'Детям', uz: 'Bolalarga', accent: true }],
    },
  ];
  const SOON = [];

  const SECTIONS = [
    { key: 'kids', games: KIDS },
    { key: 'arcade', games: ARCADE },
    { key: 'puzzles', games: PUZZLES },
    { key: 'soon', games: SOON, soon: true },
  ];

  const STR = {
    ru: {
      title: 'Игры', back: 'Назад', play: 'Начать игру',
      kids: 'Малышам • без проигрыша', arcade: 'Аркады • играй сразу',
      puzzles: 'Головоломки', soon: 'Скоро', soonBadge: 'Скоро',
      foot: (n) => `WinGo Games • ${n} игр`,
    },
    uz: {
      title: 'Oʻyinlar', back: 'Orqaga', play: 'Oʻynashni boshlash',
      kids: 'Kichkintoylarga • yutqazish yoʻq', arcade: 'Arkada • darrov oʻyna',
      puzzles: 'Boshqotirmalar', soon: 'Tez orada', soonBadge: 'Tez orada',
      foot: (n) => `WinGo Games • ${n} ta oʻyin`,
    },
  };

  let lang = localStorage.getItem('wingoHubLang') || 'ru';

  /**
   * Событие приложению — тот же транспорт, что и в @gamewingo/game-bridge
   * (iOS WKWebView → Android WebView → postMessage родителю).
   */
  function postToApp(event) {
    const w = window;
    if (w.webkit && w.webkit.messageHandlers && w.webkit.messageHandlers.gameBridge) {
      w.webkit.messageHandlers.gameBridge.postMessage(event);
      return true;
    }
    if (w.AndroidBridge) { w.AndroidBridge.onGameEvent(JSON.stringify(event)); return true; }
    if (w.parent !== w) { w.parent.postMessage(event, '*'); return true; }
    return false;
  }

  function chipsHtml(tags) {
    return tags.map((t) => (typeof t === 'string'
      ? `<span class="chip">${t}</span>`
      : `<span class="chip${t.accent ? ' accent' : ''}">${t[lang]}</span>`)).join('');
  }

  function itemHtml(g, s, soon) {
    const chips = soon ? `<span class="chip soon">${s.soonBadge}</span>` : chipsHtml(g.tags);
    const cta = soon ? '' : `<button class="cta" type="button">${s.play}</button>`;
    return `
      <article class="item${soon ? ' soon' : ''}"${soon ? '' : ` data-url="${g.url}"`}>
        <div class="row">
          <div class="thumb">${ICONS[g.id] || ''}</div>
          <div class="meta">
            <h3>${g.title[lang]}</h3>
            <p class="desc">${g.desc[lang]}</p>
            <div class="chips">${chips}</div>
          </div>
        </div>
        ${cta}
      </article>`;
  }

  function render() {
    const s = STR[lang];
    document.documentElement.lang = lang;
    document.getElementById('hTitle').textContent = s.title;
    document.getElementById('back').setAttribute('aria-label', s.back);
    document.querySelectorAll('.lang').forEach((el) =>
      el.classList.toggle('active', el.dataset.lang === lang));

    // Пустые секции (например «Скоро») не рисуются вовсе.
    document.getElementById('sections').innerHTML = SECTIONS
      .filter((sec) => sec.games.length > 0)
      .map((sec) => `
        <section>
          <h2 class="section-title">${s[sec.key]}</h2>
          <div class="card">${sec.games.map((g) => itemHtml(g, s, sec.soon)).join('')}</div>
        </section>`)
      .join('');

    const total = SECTIONS.filter((sec) => !sec.soon).reduce((n, sec) => n + sec.games.length, 0);
    document.getElementById('foot').textContent = s.foot(total);
  }

  document.getElementById('sections').addEventListener('click', (e) => {
    const item = e.target.closest('.item[data-url]');
    if (item) window.location.href = item.dataset.url;
  });

  // Назад: просим приложение закрыть раздел игр; вне WebView — обычная история браузера.
  document.getElementById('back').addEventListener('click', () => {
    if (!postToApp({ type: 'GAME_EXIT', sessionId: '' }) && history.length > 1) history.back();
  });

  document.querySelectorAll('.lang').forEach((el) =>
    el.addEventListener('click', () => {
      lang = el.dataset.lang;
      try { localStorage.setItem('wingoHubLang', lang); } catch (err) { /* приватный режим */ }
      render();
    }));

  render();
</script>
</body>
</html>
