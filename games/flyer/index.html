<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <title>GameWingo — Полёт</title>
    <style>
        /*
         * Сплэш: шапка каталога и иконка игры, пока грузится бандл (1–3 с на 3G).
         * Инлайн, а не в style.css — должен нарисоваться с первым байтом страницы.
         * Цвета — токены docs/DESIGN.md (topBar, bg, ink); убирает его hideSplash() из game-ui.
         */
        #splash { position: fixed; inset: 0; z-index: 10; background: #f9f9f9; transition: opacity .2s; }
        #splash .bar { height: calc(env(safe-area-inset-top, 0px) + 56px); background: linear-gradient(270deg, #ff7700, #fd7b03 49.52%, #ff5001);
            display: flex; align-items: flex-end; justify-content: center; }
        #splash .bar span { font: 600 20px system-ui, -apple-system, 'SF Pro Text', Roboto, sans-serif; height: 56px; line-height: 56px; color: #fff; }
        #splash img { display: block; width: 96px; height: 96px; margin: 28vh auto 0; animation: splashPulse 1.6s ease-in-out infinite; }
        @keyframes splashPulse { 50% { transform: scale(1.06); } }
        @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
</head>

<body>
    <div id="splash" aria-hidden="true">
        <div class="bar"><span data-ru="Полёт" data-uz="Parvoz">Полёт</span></div>
        <img src="./icon.svg" alt="" />
    </div>
    <script>
        // Язык сплэша — тот же выбор, что у игры: ?lang= из ссылки хаба, затем память хаба.
        (function () {
            var lang = new URLSearchParams(location.search).get('lang');
            try { lang = lang || localStorage.getItem('wingoHubLang'); } catch (e) { /* приватный режим */ }
            var t = document.querySelector('#splash .bar span');
            if (t && lang === 'uz') t.textContent = t.getAttribute('data-uz');
        })();
    </script>
    <div id="app">
        <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
